<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 850" role="img" aria-labelledby="title desc">
  <title id="title">SpecLoop end-to-end workflow</title>
  <desc id="desc">The user moves through project creation, interpretation, decomposition, literature, design, specification generation, judging, resolution, and finalization.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
  <style>.head{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.text{font:14px Arial,sans-serif;fill:#172033}.label{font:12px Arial,sans-serif;fill:#475569}.life{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:6 5}.line{stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.band{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1}</style>
  <rect width="1250" height="850" fill="#ffffff"/>
  <rect class="head" x="35" y="25" width="140" height="48" rx="6"/><text class="text" x="105" y="55" text-anchor="middle">User</text>
  <rect class="head" x="225" y="25" width="140" height="48" rx="6"/><text class="text" x="295" y="55" text-anchor="middle">Web</text>
  <rect class="head" x="415" y="25" width="140" height="48" rx="6"/><text class="text" x="485" y="55" text-anchor="middle">API</text>
  <rect class="head" x="605" y="25" width="140" height="48" rx="6"/><text class="text" x="675" y="55" text-anchor="middle">LLM</text>
  <rect class="head" x="795" y="25" width="140" height="48" rx="6"/><text class="text" x="865" y="55" text-anchor="middle">arXiv</text>
  <rect class="head" x="985" y="25" width="140" height="48" rx="6"/><text class="text" x="1055" y="55" text-anchor="middle">SQLite</text>
  <path class="life" d="M105 73 V820"/><path class="life" d="M295 73 V820"/><path class="life" d="M485 73 V820"/><path class="life" d="M675 73 V820"/><path class="life" d="M865 73 V820"/><path class="life" d="M1055 73 V820"/>
  <rect class="band" x="20" y="95" width="1150" height="70"/><text class="label" x="35" y="115">1. Project</text><path class="line" d="M105 135 H295"/><text class="label" x="200" y="128" text-anchor="middle">create</text><path class="line" d="M295 145 H485"/><path class="line" d="M485 155 H1055"/><text class="label" x="700" y="152">insert project</text>
  <rect class="band" x="20" y="180" width="1150" height="95"/><text class="label" x="35" y="200">2. Interpretation</text><path class="line" d="M105 220 H295"/><path class="line" d="M295 230 H485"/><path class="line" d="M485 240 H675"/><text class="label" x="575" y="232">structured request</text><path class="line" d="M675 250 H485"/><path class="line" d="M485 265 H1055"/><text class="label" x="700" y="263">persist proposal</text>
  <rect class="band" x="20" y="290" width="1150" height="110"/><text class="label" x="35" y="310">3. Decomposition</text><path class="line" d="M105 330 H485"/><path class="line" d="M485 340 H675"/><path class="line" d="M675 350 H485"/><path class="line" d="M485 375 H1055"/><text class="label" x="700" y="373">graph and status</text>
  <rect class="band" x="20" y="415" width="1150" height="105"/><text class="label" x="35" y="435">4. Literature</text><path class="line" d="M105 455 H485"/><path class="line" d="M485 465 H675"/><path class="line" d="M675 475 H865"/><text class="label" x="770" y="468">validated search</text><path class="line" d="M865 490 H485"/><path class="line" d="M485 505 H1055"/><text class="label" x="700" y="503">persist sources</text>
  <rect class="band" x="20" y="535" width="1150" height="110"/><text class="label" x="35" y="555">5. Design and spec</text><path class="line" d="M105 575 H485"/><path class="line" d="M485 590 H675"/><path class="line" d="M485 620 H1055"/><text class="label" x="700" y="618">design and 14 sections</text>
  <rect class="band" x="20" y="660" width="1150" height="135"/><text class="label" x="35" y="680">6. Judges and finalization</text><path class="line" d="M105 700 H485"/><path class="line" d="M485 710 H675"/><text class="label" x="575" y="703">five parallel calls</text><path class="line" d="M675 725 H485"/><path class="line" d="M485 745 H1055"/><text class="label" x="700" y="743">panel and resolutions</text><path class="line" d="M105 775 H485"/><path class="line" d="M485 785 H1055"/><text class="label" x="700" y="783">FINALIZED status</text>
</svg>
