<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">SpecLoop system context</title>
  <desc id="desc">The browser calls the Next.js web application, which calls the Fastify tRPC API. The API uses SQLite, an OpenAI-compatible LLM endpoint, and the arXiv API.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
  <style>
    .box{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.store{fill:#ecfdf5;stroke:#059669;stroke-width:2}.ext{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.text{font:16px Arial,sans-serif;fill:#172033}.label{font:13px Arial,sans-serif;fill:#475569}.line{stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <rect width="1120" height="420" fill="#ffffff"/>
  <rect class="box" x="430" y="160" width="260" height="80" rx="6"/>
  <text class="text" x="560" y="192" text-anchor="middle">SpecLoop API</text><text class="label" x="560" y="218" text-anchor="middle">Fastify + tRPC</text>
  <rect class="box" x="40" y="160" width="190" height="80" rx="6"/><text class="text" x="135" y="207" text-anchor="middle">Nguoi dung</text>
  <rect class="box" x="250" y="40" width="190" height="80" rx="6"/><text class="text" x="345" y="87" text-anchor="middle">SpecLoop Web</text><text class="label" x="345" y="108" text-anchor="middle">Next.js</text>
  <rect class="store" x="820" y="40" width="190" height="80" rx="6"/><text class="text" x="915" y="87" text-anchor="middle">SQLite</text><text class="label" x="915" y="108" text-anchor="middle">Drizzle queries</text>
  <rect class="ext" x="730" y="160" width="300" height="80" rx="6"/><text class="text" x="880" y="193" text-anchor="middle">OpenAI-compatible</text><text class="label" x="880" y="218" text-anchor="middle">LLM endpoint</text>
  <rect class="ext" x="430" y="300" width="260" height="80" rx="6"/><text class="text" x="560" y="347" text-anchor="middle">arXiv API</text>
  <path class="line" d="M230 200 H430"/><text class="label" x="330" y="187" text-anchor="middle">browser interaction</text>
  <path class="line" d="M345 120 V160"/><text class="label" x="395" y="145">tRPC over HTTP</text>
  <path class="line" d="M690 180 H730"/><text class="label" x="710" y="168" text-anchor="middle">structured AI</text>
  <path class="line" d="M690 220 C760 260 820 100 820 100" fill="none"/><text class="label" x="755" y="118">Drizzle</text>
  <path class="line" d="M560 240 V300"/><text class="label" x="580" y="274">validated search</text>
</svg>
