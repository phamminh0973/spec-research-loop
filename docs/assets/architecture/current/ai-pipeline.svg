<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 430" role="img" aria-labelledby="title desc">
  <title id="title">Structured output pipeline</title>
  <desc id="desc">Typed input is prompted with untrusted blocks, sent with a Zod-derived JSON schema, parsed, validated, checked against reference IDs, and optionally repaired once.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
  <style>.box{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:2}.bad{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.text{font:14px Arial,sans-serif;fill:#172033}.label{font:12px Arial,sans-serif;fill:#475569}.line{stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}</style>
  <rect width="1250" height="430" fill="#ffffff"/>
  <rect class="box" x="30" y="160" width="145" height="65" rx="6"/><text class="text" x="102" y="198" text-anchor="middle">Typed input</text>
  <rect class="box" x="220" y="160" width="190" height="65" rx="6"/><text class="text" x="315" y="190" text-anchor="middle">System prompt</text><text class="label" x="315" y="211" text-anchor="middle">untrusted blocks</text>
  <rect class="box" x="455" y="160" width="180" height="65" rx="6"/><text class="text" x="545" y="190" text-anchor="middle">JSON Schema</text><text class="label" x="545" y="211" text-anchor="middle">from Zod</text>
  <rect class="box" x="680" y="160" width="145" height="65" rx="6"/><text class="text" x="752" y="198" text-anchor="middle">LLM provider</text>
  <rect class="box" x="870" y="160" width="130" height="65" rx="6"/><text class="text" x="935" y="198" text-anchor="middle">JSON parse</text>
  <rect class="box" x="1045" y="160" width="160" height="65" rx="6"/><text class="text" x="1125" y="198" text-anchor="middle">Zod validation</text>
  <path class="line" d="M175 192 H220"/><path class="line" d="M410 192 H455"/><path class="line" d="M635 192 H680"/><path class="line" d="M825 192 H870"/><path class="line" d="M1000 192 H1045"/>
  <rect class="box" x="870" y="315" width="160" height="65" rx="6"/><text class="text" x="950" y="353" text-anchor="middle">Reference allowlist</text>
  <rect class="ok" x="1080" y="315" width="125" height="65" rx="6"/><text class="text" x="1142" y="353" text-anchor="middle">Accepted</text>
  <rect class="box" x="625" y="315" width="180" height="65" rx="6"/><text class="text" x="715" y="345" text-anchor="middle">One repair attempt</text><text class="label" x="715" y="366" text-anchor="middle">then validate again</text>
  <rect class="bad" x="405" y="315" width="140" height="65" rx="6"/><text class="text" x="475" y="353" text-anchor="middle">Error</text>
  <path class="line" d="M1125 225 V315"/><path class="line" d="M1030 347 H1080"/><text class="label" x="1055" y="337" text-anchor="middle">valid</text>
  <path class="dash" d="M935 225 C935 270 715 270 715 315" fill="none"/><path class="dash" d="M1125 225 C1125 270 715 270 715 315" fill="none"/><path class="dash" d="M950 315 C900 285 500 285 500 225" fill="none"/><path class="dash" d="M715 380 C650 410 475 410 475 380" fill="none"/><text class="label" x="815" y="270">invalid parse or schema</text><text class="label" x="600" y="410">invalid after repair</text>
</svg>
