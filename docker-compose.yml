# api, web are exercised locally. SQLite is file-backed via DATABASE_PATH volume.
# No external Postgres service needed — Drizzle ORM uses node:sqlite (DatabaseSync).
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/specloop.db
      STORAGE_PATH: /app/storage
      API_PORT: ${API_PORT:-4000}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - sqlite_data:/app/data
      - ./storage:/app/storage

  web:
    build:
      context: ./apps/web
    env_file:
      - .env
    environment:
      # tRPC is reached via the typed client; this URL is only used for the
      # browser-side HTTP origin. The path /trpc is appended by the client.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  sqlite_data:
